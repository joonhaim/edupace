<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EduPace – Session logs</title>
    <meta name="application-name" content="EduPace">
    <meta name="theme-color" content="#f5f7fa">
    <link rel="icon" type="image/png" href="/simulator-interface/assets/logos/edupace_logo2.png" sizes="180x180">
    <link rel="apple-touch-icon" href="/simulator-interface/assets/logos/edupace_logo2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="styles/main.css">
    <script src="js/layout.js" defer></script>
    <script type="module" src="js/navInit.js"></script>
    <script type="module" src="js/logsPage.js"></script>
</head>
<body class="page-logs theme-transition">
    <div class="app-shell">
        <div data-partial="nav" data-active-page="logs"></div>

        <main class="screen-stack">
            <section aria-label="Session logs">
                <div class="logs-shell">
                    <div class="logs-header">
                        <div>
                            <p class="eyebrow">Recorded sessions</p>
                            <h1>Session logs</h1>
                        </div>
                        <div class="logs-header-actions">
                            <p>Download completed runs as JSON or CSV.</p>
                        </div>
                    </div>

                    <div class="logs-toolbar" aria-label="Log filters">
                        <label class="logs-filter">
                            <span class="filter-label">Search</span>
                            <input id="logSearch" type="search" placeholder="Scenario, operator, notes" />
                        </label>
                        <label class="logs-filter">
                            <span class="filter-label">Sort by</span>
                            <select id="logSort">
                                <option value="newest">Newest first</option>
                                <option value="oldest">Oldest first</option>
                                <option value="duration">Longest duration</option>
                                <option value="events">Most events</option>
                            </select>
                        </label>
                    </div>

                    <div id="logsEmpty" class="log-empty" role="status">
                        No sessions have been logged yet. Complete a run to see it here.
                    </div>

                    <div class="logs-grid">
                        <div id="logsList" class="log-list" aria-live="polite"></div>
                        <div id="logDetailPanel" class="log-detail is-hidden" aria-live="polite"></div>
                    </div>
                </div>
            </section>
        </main>

        <div data-partial="footer"></div>
    </div>

    <div class="settings-layer is-hidden" data-log-settings-layer>
        <div class="card settings-card settings-window log-settings" data-log-settings-panel aria-labelledby="logSettingsTitle">
            <div class="card-heading settings-window-header">
                <div>
                    <p class="eyebrow">Display</p>
                    <h3 id="logSettingsTitle">Log date &amp; time</h3>
                </div>
                <div class="settings-window-actions">
                    <button type="button" class="btn btn-ghost btn-small settings-toggle" data-settings-toggle aria-label="Close log settings">
                        Close
                    </button>
                </div>
            </div>

            <div class="settings-body">
                <div class="settings-section">
                    <div class="settings-grid">
                        <label class="setting-field" for="logDateFormat">
                            <span class="setting-label">Date format</span>
                            <select id="logDateFormat" data-log-date-format>
                                <option value="DMY">DD/MM/YYYY</option>
                                <option value="MDY">MM/DD/YYYY</option>
                                <option value="YMD">YYYY-MM-DD</option>
                            </select>
                        </label>

                        <label class="setting-field" for="logTimeFormat">
                            <span class="setting-label">Time format</span>
                            <select id="logTimeFormat" data-log-time-format>
                                <option value="24h">24-hour (13:45)</option>
                                <option value="12h">12-hour (1:45 pm)</option>
                            </select>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
