<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EduPace</title>
    <meta name="description"
          content="EduPace is an educational simulator for temporary external single-chamber ventricular pacing.">
    <meta name="application-name" content="EduPace">
    <meta name="theme-color" content="#0b74c9">
    <link rel="icon" type="image/png" href="/simulator-interface/assets/logos/edupace_logo2.png" sizes="180x180">
    <link rel="apple-touch-icon" href="/simulator-interface/assets/logos/edupace_logo2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="styles/main.css">
    <script src="js/layout.js" defer></script>
</head>
<body>
    <div class="app-shell">
        <!-- Top nav -->
        <div data-partial="nav" data-active-page="home"></div>

        <!-- Main content -->
        <main class="screen-stack">
            <section aria-label="Home page">
                <div class="landing-panel">
                    <div class="landing-grid">
                        <div class="landing-main">
                            <p class="eyebrow">Ventricular pacing trainer</p>
                            <h1 class="landing-title">EduPace</h1>
                            <p class="landing-subtitle">
                                Focused practice for temporary single-chamber pacing.
                            </p>
                            <ul class="landing-highlights">
                                <li>Real-time ECG with pacing spikes and sensing LEDs</li>
                                <li>Scenario-based training with feedback</li>
                            </ul>
                            <div class="landing-actions">
                                <a class="btn btn-primary" href="simulation.html">Launch simulator</a>
                                <a class="btn btn-ghost" href="instructions.html">Instructions</a>
                            </div>
                            <p class="landing-meta">
                                Designed for CCU / ER nurse training · Not for diagnostic use.
                            </p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <div data-partial="footer"></div>
    </div>
</body>
</html>
