<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>About EduPace</title>
    <style>
      :root {
        --text: rgba(0,0,0,0.88);
        --muted: rgba(0,0,0,0.6);
        --line: rgba(0,0,0,0.12);
      }

      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 18px;
        color: var(--text);
        background: #fff;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .logos {
        display: flex;
        align-items: center;
        gap: 14px;
        opacity: 0.95;
      }

      .logos img {
        height: 32px; /* ⬅️ larger logos */
        width: auto;
        display: block;
      }

      .divider {
        width: 1px;
        height: 26px;
        background: var(--line);
      }

      .close {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 10px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
      }

      .close:hover {
        background: rgba(0,0,0,0.04);
      }

      h2 {
        margin: 6px 0 4px 0;
        font-size: 22px;
        letter-spacing: 0.2px;
      }

      .subtitle {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 12px;
      }

      hr {
        border: none;
        border-top: 1px solid var(--line);
        margin: 12px 0;
      }

      .row {
        font-size: 13px;
        margin: 6px 0;
      }

      code {
        background: rgba(0,0,0,0.06);
        padding: 2px 6px;
        border-radius: 8px;
        font-size: 12px;
      }

      .team {
        margin-top: 12px;
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.5;
      }

      .team strong {
        color: var(--text);
        font-weight: 600;
      }

      .foot {
        font-size: 12px;
        color: var(--muted);
        margin-top: 10px;
      }

      a {
        display: inline-block;
        margin-top: 10px;
        font-size: 13px;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="top">
      <div class="logos">
        <img src="./icons/edupace.png" alt="EduPace" />
        <div class="divider"></div>
        <img src="./icons/tu_delft.svg" alt="TU Delft" />
      </div>

      <button class="close" id="closeBtn">Close</button>
    </div>

    <h2>EduPace</h2>
    <div class="subtitle">Educational simulator for temporary pacing.</div>

    <hr />

    <div class="row">Version: <code id="version"></code></div>
    <div class="row">Build: <code id="build"></code></div>

    <div class="team">
      <strong>TU Delft EduPace Team</strong><br />
      Cees Vlasman · Süheyla Nurlu · Ashley Jacobi · Adrien Joon-Ha Im
    </div>

    <div class="foot">Simulation only — not for clinical use.</div>

    <a id="home" href="#" target="_blank" rel="noreferrer">
      Project / Documentation
    </a>

    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById('version').textContent =
        params.get('version') || 'unknown';
      document.getElementById('build').textContent =
        params.get('build') || 'dev';

      const home = document.getElementById('home');
      home.href = params.get('home') || 'https://example.com';

      document.getElementById('closeBtn').onclick = () => window.close();
      window.addEventListener('keydown', e => {
        if (e.key === 'Escape') window.close();
      });
    </script>
  </body>
</html>
