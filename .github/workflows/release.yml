name: Build & Release EduPace

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build installers only — do NOT publish from electron-builder
      - name: Build Electron app
        run: npm run dist -- --publish never

      # Create the GitHub Release if needed, then upload this OS's installers directly
      - name: Create GitHub Release (if missing) + upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # Create the release if it doesn't exist yet
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "EduPace $TAG" \
              --notes "EduPace desktop release."
          fi

          # Upload installers from this runner
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe)

          if ((${#files[@]})); then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            echo "No installers found in dist/."
            ls -la dist || true
            exit 1
          fi
