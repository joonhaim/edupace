name: Build & Release EduPace

on:
  push:
    tags:
      - "v*.*.*"      # v0.2.2, v0.3.0, etc.
  workflow_dispatch:

permissions:
  contents: write     # required to create GitHub Releases

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifacts
          path: dist/**
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update GitHub Release + upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "EduPace $TAG" \
              --notes "Automated build." \
              --prerelease
          fi
          
          shopt -s globstar nullglob
          
          # Collect files you actually want on the release
          release_files=(
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.yml
            artifacts/**/*.blockmap
          )
          
          if ((${#release_files[@]})); then
            mkdir -p upload_tmp
            upload_args=()
          
            for file in "${release_files[@]}"; do
              # Make a unique filename based on its path under artifacts/
              relative_path="${file#artifacts/}"
              unique_name="${relative_path//\//_}"   # e.g. macOS-artifacts_builder-debug.yml
          
              # Copy to a temp file whose basename is the unique asset name
              tmp_path="upload_tmp/${unique_name}"
              cp -f "$file" "$tmp_path"
          
              upload_args+=("$tmp_path")
            done
          
            gh release upload "$TAG" "${upload_args[@]}" --clobber
          else
            echo "No release artifacts found to upload."
          fi

