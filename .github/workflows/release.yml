name: Build & Release EduPace

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build installers only — NO auto-publish
      - name: Build Electron app
        run: npm run dist -- --publish never

      # Upload only the final installers
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-installers
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release & upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          gh release create "$TAG" \
            --title "EduPace $TAG" \
            --notes "EduPace desktop release." \
            --draft=false \
            --prerelease=false || true

          shopt -s globstar nullglob
          files=(artifacts/**/*.dmg artifacts/**/*.exe)

          if ((${#files[@]})); then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            echo "No installers found."
            exit 1
          fi
